[package]
name = "deeptutor-desktop"
version = "1.6.7"
description = "DeepTutor desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "deeptutor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
